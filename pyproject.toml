[project]
name = "trippilot"
version = "0.1.0"
description = "Agentic trip-planning app with deterministic itinerary validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
foundry = [
    "azure-ai-projects",
    "azure-identity",
    "openai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
